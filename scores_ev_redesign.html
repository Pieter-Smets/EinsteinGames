<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstein Games - Scores Evergem</title>
    <style>
        :root {
            --bg: #020817;
            --bg-2: #0f172a;
            --panel: #111827;
            --panel-2: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --accent-2: #0ea5e9;
            --gold: #fbbf24;
            --silver: #cbd5e1;
            --bronze: #f59e0b;
            --success: #22c55e;
            --danger: #ef4444;
            --shadow: rgba(15, 23, 42, 0.6);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at top, rgba(56,189,248,0.15), transparent 25%),
                linear-gradient(180deg, var(--bg), var(--bg-2));
            color: var(--text);
            padding: 2rem 1rem;
        }

        .page {
            width: min(920px, 100%);
            margin: 0 auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .back-btn {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .back-btn:hover {
            text-decoration: underline;
        }

        .live-status {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(148,163,184,0.25);
            color: var(--muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
            animation: pulse 1.8s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.7); }
            70% { box-shadow: 0 0 0 12px rgba(34,197,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
        }

        .timer-bar-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.08);
            border-radius: 999px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 1s linear;
        }

        .header-box {
            padding: 1.5rem 1rem 0;
            text-align: center;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 0.8rem;
            padding: 0.45rem 0.9rem;
            border-radius: 999px;
            background: rgba(56,189,248,0.08);
            border: 1px solid rgba(56,189,248,0.25);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 4vw, 4rem);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text);
        }

        .subtitle {
            margin: 0.8rem 0 2rem;
            color: var(--muted);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(145deg, rgba(17,24,39,0.95), rgba(15,23,42,0.9));
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 18px;
            padding: 1rem 1.2rem;
            box-shadow: 0 16px 36px rgba(0,0,0,0.2);
        }

        .stat-label {
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .stat-value {
            margin-top: 0.45rem;
            font-size: clamp(1.6rem, 3vw, 2.3rem);
            font-weight: 800;
            color: var(--accent);
        }

        .leaderboard {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(148,163,184,0.2);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 28px 50px rgba(0,0,0,0.25);
        }

        .header-row {
            display: flex;
            align-items: center;
            background: rgba(2, 8, 23, 0.65);
            color: var(--muted);
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 1rem 1.4rem;
            border-bottom: 1px solid rgba(148,163,184,0.12);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.4rem;
            border-bottom: 1px solid rgba(148,163,184,0.08);
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .row:hover {
            background: rgba(255,255,255,0.02);
            transform: translateX(3px);
        }

        .row:last-child {
            border-bottom: none;
        }

        .col-rank {
            flex: 0 0 72px;
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--muted);
        }

        .col-class {
            flex: 1;
            font-size: 1.15rem;
            font-weight: 700;
        }

        .col-score {
            flex: 0 0 120px;
            text-align: right;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--accent);
        }

        .rank-1 .col-rank { color: var(--gold); }
        .rank-2 .col-rank { color: var(--silver); }
        .rank-3 .col-rank { color: var(--bronze); }

        .rank-1 {
            background: linear-gradient(90deg, rgba(251,191,36,0.08), transparent 60%);
        }

        .rank-2 {
            background: linear-gradient(90deg, rgba(148,163,184,0.08), transparent 60%);
        }

        .rank-3 {
            background: linear-gradient(90deg, rgba(245,158,11,0.08), transparent 60%);
        }

        .loading, .error {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 640px) {
            .col-score {
                flex-basis: 90px;
            }

            .header-row, .row {
                padding-left: 1rem;
                padding-right: 1rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="page">
        <div class="topbar">
            <a href="index.html" class="back-btn">← Back to menu</a>
            <div class="live-status">
                <div class="pulse-dot"></div>
                <span>Live updates</span>
            </div>
        </div>

        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="header-box">
            <div class="eyebrow">Einstein Games</div>
            <h1>Scores Evergem</h1>
            <p class="subtitle">Live leaderboard</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Current leader</div>
                <div id="leader-name" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Top score</div>
                <div id="top-score" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Entries</div>
                <div id="entry-count" class="stat-value">--</div>
            </div>
        </div>

        <div class="leaderboard">
            <div class="header-row">
                <div class="col-rank">#</div>
                <div class="col-class">Klas</div>
                <div class="col-score">Score</div>
            </div>
            <div id="board-content">
                <div class="loading">Loading scores...</div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPp-_3q8eKAynOcrOs51zcpUpXEWOO2Bczf5Z6v2YbQ8W-eRYW2t5PnRT4SOVWDTQ-SlJ0dWSdmFu2/pub?gid=0&single=true&output=csv';
        const REFRESH_INTERVAL = 60;
        let timeLeft = REFRESH_INTERVAL;

        async function fetchLeaderboard() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                parseAndRenderCSV(csvText);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('board-content').innerHTML =
                    '<div class="error">Could not load scores. Please check the file path.</div>';
            }
        }

        function parseAndRenderCSV(csvText) {
            const rows = csvText.split(/\r?\n/);
            const boardContent = document.getElementById('board-content');
            boardContent.innerHTML = '';
            const teams = [];

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].trim();
                if (!row) continue;

                let cols = [];
                let match;
                const regex = /"([^"]*)"|([^,]+)/g;

                while ((match = regex.exec(row))) {
                    cols.push(match[1] !== undefined ? match[1] : match[2]);
                }

                cols = cols.map(c => c ? c.trim() : '');

                if (cols.length >= 2) {
                    const klas = cols[0];
                    const scoreStr = cols[1];

                    if (!klas || klas === 'NaN' || klas.toLowerCase() === 'klas' || klas.toLowerCase() === 'unnamed: 0') {
                        continue;
                    }

                    const cleanScoreStr = scoreStr.replace(/"/g, '').replace(',', '.');
                    const scoreNum = parseFloat(cleanScoreStr);

                    if (!isNaN(scoreNum)) {
                        teams.push({
                            klas,
                            scoreDisplay: scoreNum.toString().replace('.', ','),
                            scoreValue: scoreNum
                        });
                    }
                }
            }

            if (teams.length === 0) {
                boardContent.innerHTML = '<div class="error">No valid data found in the CSV.</div>';
                return;
            }

            teams.sort((a, b) => b.scoreValue - a.scoreValue);

            const leaderName = document.getElementById('leader-name');
            const topScore = document.getElementById('top-score');
            const entryCount = document.getElementById('entry-count');

            leaderName.textContent = teams[0].klas;
            topScore.textContent = teams[0].scoreDisplay;
            entryCount.textContent = teams.length;

            teams.forEach((team, index) => {
                const rank = index + 1;
                const rowDiv = document.createElement('div');
                rowDiv.className = `row rank-${rank}`;
                rowDiv.innerHTML = `
                    <div class="col-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</div>
                    <div class="col-class">${team.klas}</div>
                    <div class="col-score">${team.scoreDisplay}</div>
                `;
                boardContent.appendChild(rowDiv);
            });

            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        function startAutoRefresh() {
            setInterval(() => {
                timeLeft--;
                const timerBar = document.getElementById('timer-bar');
                if (timerBar) {
                    const percentage = (timeLeft / REFRESH_INTERVAL) * 100;
                    timerBar.style.width = `${percentage}%`;
                }

                if (timeLeft <= 0) {
                    fetchLeaderboard();
                    timeLeft = REFRESH_INTERVAL;
                }
            }, 1000);
        }

        fetchLeaderboard();
        startAutoRefresh();
    </script>
</body>
</html>
