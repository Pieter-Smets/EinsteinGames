<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstein Games Leaderboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --gold: #fbbf24;
            --silver: #94a3b8;
            --bronze: #b45309;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .leaderboard {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .header-row {
            display: flex;
            background: rgba(0,0,0,0.2);
            padding: 1rem 1.5rem;
            font-weight: bold;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .row {
            display: flex;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
            align-items: center;
        }

        .row:hover {
            background: rgba(255,255,255,0.05);
        }

        .col-rank { flex: 0 0 60px; font-weight: bold; font-size: 1.2rem; }
        .col-class { flex: 1; font-size: 1.2rem; }
        .col-score { flex: 0 0 80px; text-align: right; font-weight: bold; color: var(--accent); }

        /* Medals for Top 3 */
        .rank-1 .col-rank { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .rank-2 .col-rank { color: var(--silver); }
        .rank-3 .col-rank { color: var(--bronze); }

        .loading, .error {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <h1>Einstein Games</h1>
    <p class="subtitle">Live Leaderboard</p>

    <div class="leaderboard">
        <div class="header-row">
            <div class="col-rank">#</div>
            <div class="col-class">Klas (Class)</div>
            <div class="col-score">Score</div>
        </div>
        <div id="board-content">
            <div class="loading">Loading scores...</div>
        </div>
    </div>

    <script>
        // Data source: Change to your active file
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPp-_3q8eKAynOcrOs51zcpUpXEWOO2Bczf5Z6v2YbQ8W-eRYW2t5PnRT4SOVWDTQ-SlJ0dWSdmFu2/pub?output=csv';

        async function fetchLeaderboard() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                
                parseAndRenderCSV(csvText);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('board-content').innerHTML = 
                    `<div class="error">Could not load scores. Please check the file path.</div>`;
            }
        }

        function parseAndRenderCSV(csvText) {
            // A more robust regex to split CSV lines, handling commas inside quotes
            const rows = csvText.split(/\r?\n/);
            const boardContent = document.getElementById('board-content');
            boardContent.innerHTML = ''; 

            let teams = [];

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].trim();
                if (!row) continue;

                // This regex splits by comma, but ignores commas inside double quotes
                // It also removes the surrounding quotes from the resulting strings
                let cols = [];
                let match;
                const regex = /"([^"]*)"|([^,]+)/g;
                
                while (match = regex.exec(row)) {
                    // match[1] is the value if it was in quotes, match[2] is the value without quotes
                    cols.push(match[1] !== undefined ? match[1] : match[2]);
                }

                // Clean up any remaining whitespace
                cols = cols.map(c => c ? c.trim() : '');

                if (cols.length >= 2) {
                    const klas = cols[0];
                    let scoreStr = cols[1];

                    // Skip the first two junk rows (NaN and the header row)
                    if (!klas || klas === 'NaN' || klas.toLowerCase() === 'klas' || klas.toLowerCase() === 'unnamed: 0') {
                        continue; 
                    }

                    // Replace comma with dot for JavaScript math, handle cases where quotes might have leaked
                    let cleanScoreStr = scoreStr.replace(/"/g, '').replace(',', '.');
                    const scoreNum = parseFloat(cleanScoreStr);

                    if (!isNaN(scoreNum)) {
                        teams.push({ 
                            klas: klas, 
                            // Format back to European style for display
                            scoreDisplay: scoreNum.toString().replace('.', ','), 
                            scoreValue: scoreNum 
                        });
                    }
                }
            }

            if (teams.length === 0) {
                boardContent.innerHTML = `<div class="error">No valid data found in the CSV.</div>`;
                return;
            }

            // Sort teams highest to lowest
            teams.sort((a, b) => b.scoreValue - a.scoreValue);

            // Render
            teams.forEach((team, index) => {
                const rank = index + 1;
                const rowDiv = document.createElement('div');
                rowDiv.className = `row rank-${rank}`;
                
                rowDiv.innerHTML = `
                    <div class="col-rank">${rank}</div>
                    <div class="col-class">${team.klas}</div>
                    <div class="col-score">${team.scoreDisplay}</div>
                `;
                
                boardContent.appendChild(rowDiv);
            });
        }

        // Initialize
        fetchLeaderboard();
        
        // Refresh every 60 seconds (useful if using live Google Sheet link)
        // setInterval(fetchLeaderboard, 60000); 
    </script>
</body>
</html>
