<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstein Games - Scores Oostakker</title>
    <link rel="stylesheet" href="redesign.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="scoreboard-page">
    <div class="page">
        <div class="topbar">
            <a href="index.html" class="back-btn">← Terug naar menu</a>
            <div class="live-status">
                <div class="pulse-dot"></div>
                <span>Live updates</span>
            </div>
        </div>

        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="header-box">
            <div class="eyebrow">Einstein Games</div>
            <h1>Scores Oostakker</h1>
            <p class="subtitle">Live klassement</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Huidige leider</div>
                <div id="leader-name" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Hoogste score</div>
                <div id="top-score" class="stat-value">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Inzendingen</div>
                <div id="entry-count" class="stat-value">--</div>
            </div>
        </div>

        <div class="leaderboard">
            <div class="header-row">
                <div class="col-rank">#</div>
                <div class="col-class">Klas</div>
                <div class="col-score">Score</div>
            </div>
            <div id="board-content">
                <div class="loading">Scores laden...</div>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPp-_3q8eKAynOcrOs51zcpUpXEWOO2Bczf5Z6v2YbQ8W-eRYW2t5PnRT4SOVWDTQ-SlJ0dWSdmFu2/pub?gid=689096365&single=true&output=csv';
        const REFRESH_INTERVAL = 60;
        let timeLeft = REFRESH_INTERVAL;

        async function fetchLeaderboard() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                parseAndRenderCSV(csvText);
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('board-content').innerHTML = '<div class="error">Could not load scores. Please check the file path.</div>';
            }
        }

        function parseAndRenderCSV(csvText) {
            const rows = csvText.split(/\r?\n/);
            const boardContent = document.getElementById('board-content');
            boardContent.innerHTML = '';
            const teams = [];

            for (let i = 0; i < rows.length; i++) {
                const row = rows[i].trim();
                if (!row) continue;

                let cols = [];
                let match;
                const regex = /"([^"]*)"|([^,]+)/g;

                while ((match = regex.exec(row))) {
                    cols.push(match[1] !== undefined ? match[1] : match[2]);
                }

                cols = cols.map(c => c ? c.trim() : '');

                if (cols.length >= 2) {
                    const klas = cols[0];
                    const scoreStr = cols[1];

                    if (!klas || klas === 'NaN' || klas.toLowerCase() === 'klas' || klas.toLowerCase() === 'unnamed: 0') {
                        continue;
                    }

                    const cleanScoreStr = scoreStr.replace(/"/g, '').replace(',', '.');
                    const scoreNum = parseFloat(cleanScoreStr);

                    if (!isNaN(scoreNum)) {
                        teams.push({
                            klas,
                            scoreDisplay: scoreNum.toString().replace('.', ','),
                            scoreValue: scoreNum
                        });
                    }
                }
            }

            if (teams.length === 0) {
                boardContent.innerHTML = '<div class="error">No valid data found in the CSV.</div>';
                return;
            }

            teams.sort((a, b) => b.scoreValue - a.scoreValue);

            const leaderName = document.getElementById('leader-name');
            const topScore = document.getElementById('top-score');
            const entryCount = document.getElementById('entry-count');

            leaderName.textContent = teams[0].klas;
            topScore.textContent = teams[0].scoreDisplay;
            entryCount.textContent = teams.length;

            teams.forEach((team, index) => {
                const rank = index + 1;
                const rowDiv = document.createElement('div');
                rowDiv.className = `row rank-${rank}`;
                rowDiv.innerHTML = `
                    <div class="col-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</div>
                    <div class="col-class">${team.klas}</div>
                    <div class="col-score">${team.scoreDisplay}</div>
                `;
                boardContent.appendChild(rowDiv);
            });

            if (typeof confetti === 'function') {
                confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
        }

        function startAutoRefresh() {
            setInterval(() => {
                timeLeft--;
                const timerBar = document.getElementById('timer-bar');
                if (timerBar) {
                    const percentage = (timeLeft / REFRESH_INTERVAL) * 100;
                    timerBar.style.width = `${percentage}%`;
                }

                if (timeLeft <= 0) {
                    fetchLeaderboard();
                    timeLeft = REFRESH_INTERVAL;
                }
            }, 1000);
        }

        fetchLeaderboard();
        startAutoRefresh();
    </script>
</body>
</html>
