<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstein Games - Scores Oostakker</title>
    <style>
        /* Keeping your original styles */
        :root {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --accent: #38bdf8; --gold: #fbbf24;
            --silver: #94a3b8; --bronze: #b45309;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 2rem; display: flex; flex-direction: column; align-items: center;
        }
        h1 {
            font-size: 3rem; margin-bottom: 0.5rem; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
        }
        p.subtitle { color: var(--text-muted); margin-bottom: 2rem; }
        
        /* New Back Button Style */
        .back-btn {
            align-self: flex-start;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 1rem;
            font-weight: bold;
        }
        .back-btn:hover { text-decoration: underline; }

        .leaderboard {
            width: 100%; max-width: 600px; background: var(--card-bg);
            border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden;
        }
        .header-row {
            display: flex; background: rgba(0,0,0,0.2); padding: 1rem 1.5rem;
            font-weight: bold; color: var(--text-muted); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .row {
            display: flex; padding: 1rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s; align-items: center;
        }
        .row:hover { background: rgba(255,255,255,0.05); }
        .col-rank { flex: 0 0 60px; font-weight: bold; font-size: 1.2rem; }
        .col-class { flex: 1; font-size: 1.2rem; }
        .col-score { flex: 0 0 80px; text-align: right; font-weight: bold; color: var(--accent); }
        .rank-1 .col-rank { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        .rank-2 .col-rank { color: var(--silver); }
        .rank-3 .col-rank { color: var(--bronze); }
        .loading, .error { text-align: center; padding: 2rem; color: var(--text-muted); }

        .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 600px;
    margin-bottom: 0.5rem;
}

.live-status {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    font-weight: bold;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.pulse-dot {
    width: 10px;
    height: 10px;
    background-color: #22c55e;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
    70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
}

.timer-bar-container {
    width: 100%;
    max-width: 600px;
    height: 4px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.5rem;
}

.timer-bar {
    height: 100%;
    width: 100%;
    background: var(--accent);
    transition: width 1s linear;
}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="top-bar">
    <a href="index.html" class="back-btn">← Terug naar menu</a>
    <div class="live-status">
        <div class="pulse-dot"></div>
        <span>Live Updates</span>
    </div>
</div>

<div class="timer-bar-container">
    <div id="timer-bar" class="timer-bar"></div>
</div>>
    <h1>Scores Oostakker</h1>
    <p class="subtitle">Live Scorebord</p>

    <div class="leaderboard">
        <div class="header-row">
            <div class="col-rank">#</div>
            <div class="col-class">Klas</div>
            <div class="col-score">Score</div>
        </div>
        <div id="board-content">
            <div class="loading">Scores laden...</div>
        </div>
    </div>

    <script>
        // INSERT YOUR OA CSV LINK HERE
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRPp-_3q8eKAynOcrOs51zcpUpXEWOO2Bczf5Z6v2YbQ8W-eRYW2t5PnRT4SOVWDTQ-SlJ0dWSdmFu2/pub?gid=689096365&single=true&output=csv';


const REFRESH_INTERVAL = 60; // Refresh every 60 seconds
let timeLeft = REFRESH_INTERVAL;

async function fetchLeaderboard() {
    try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('Network response was not ok');
        const csvText = await response.text();
        parseAndRenderCSV(csvText);
    } catch (error) {
        console.error('Error fetching data:', error);
        document.getElementById('board-content').innerHTML = 
            `<div class="error">Could not load scores. Please check the file path.</div>`;
    }
}

function parseAndRenderCSV(csvText) {
    const rows = csvText.split(/\r?\n/);
    const boardContent = document.getElementById('board-content');
    boardContent.innerHTML = ''; 
    let teams = [];

    for (let i = 0; i < rows.length; i++) {
        const row = rows[i].trim();
        if (!row) continue;

        let cols = [];
        let match;
        const regex = /"([^"]*)"|([^,]+)/g;
        
        while (match = regex.exec(row)) {
            cols.push(match[1] !== undefined ? match[1] : match[2]);
        }
        cols = cols.map(c => c ? c.trim() : '');

        if (cols.length >= 2) {
            const klas = cols[0];
            let scoreStr = cols[1];

            if (!klas || klas === 'NaN' || klas.toLowerCase() === 'klas' || klas.toLowerCase() === 'unnamed: 0') {
                continue; 
            }

            let cleanScoreStr = scoreStr.replace(/"/g, '').replace(',', '.');
            const scoreNum = parseFloat(cleanScoreStr);

            if (!isNaN(scoreNum)) {
                teams.push({ 
                    klas: klas, 
                    scoreDisplay: scoreNum.toString().replace('.', ','), 
                    scoreValue: scoreNum 
                });
            }
        }
    }

    if (teams.length === 0) {
        boardContent.innerHTML = `<div class="error">No valid data found in the CSV.</div>`;
        return;
    }

    teams.sort((a, b) => b.scoreValue - a.scoreValue);

    teams.forEach((team, index) => {
        const rank = index + 1;
        const rowDiv = document.createElement('div');
        rowDiv.className = `row rank-${rank}`;
        rowDiv.innerHTML = `
            <div class="col-rank">${rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : rank}</div>
            <div class="col-class">${team.klas}</div>
            <div class="col-score">${team.scoreDisplay}</div>
        `;
        boardContent.appendChild(rowDiv);
    });

    // Trigger Confetti Burst for 1st Place
    if (typeof confetti === 'function') {
        confetti({
            particleCount: 70,
            spread: 60,
            origin: { y: 0.6 }
        });
    }
}

// Timer & Auto-Refresh logic
function startAutoRefresh() {
    setInterval(() => {
        timeLeft--;
        const timerBar = document.getElementById('timer-bar');
        if (timerBar) {
            const percentage = (timeLeft / REFRESH_INTERVAL) * 100;
            timerBar.style.width = `${percentage}%`;
        }

        if (timeLeft <= 0) {
            fetchLeaderboard();
            timeLeft = REFRESH_INTERVAL;
        }
    }, 1000);
}

// Run initial fetch and start timer
fetchLeaderboard();
startAutoRefresh();
    </script>
</body>
</html>
